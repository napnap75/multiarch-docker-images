</header>
<main class="wrap">
  <div class="detailhead">
    <div class="detailtitle">
      <h2 id="docname"></h2>
      <span id="docstatus" class="badge"></span>
    </div>
    <nav id="docnav" class="docnav" aria-label="Navigation entre documents">
      <a id="prevDoc" class="docnav-link" aria-label="Document précédent" title="Document précédent">
        <svg viewBox="0 0 448 512" aria-hidden="true"><path d="M257.5 445.1c9.4-9.4 9.4-24.6 0-33.9L138.9 292H408c13.3 0 24-10.7 24-24s-10.7-24-24-24H138.9l118.6-118.1c9.4-9.4 9.4-24.6 0-33.9s-24.6-9.4-33.9 0l-160 160c-9.4 9.4-9.4 24.6 0 33.9l160 160c9.4 9.4 24.6 9.4 33.9 0z"/></svg>
      </a>
      <a id="nextDoc" class="docnav-link" aria-label="Document suivant" title="Document suivant">
        <svg viewBox="0 0 448 512" aria-hidden="true"><path d="M190.5 66.9c9.4-9.4 24.6-9.4 33.9 0l160 160c9.4 9.4 9.4 24.6 0 33.9l-160 160c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9L309.1 268H40c-13.3 0-24-10.7-24-24s10.7-24 24-24h269.1L190.5 100.9c-9.4-9.4-9.4-24.6 0-33.9z"/></svg>
      </a>
    </nav>
  </div>
  <div class="detailgrid">
    <section class="card pdfpane">
      <iframe id="pdf" title="Aperçu du document"></iframe>
      <div id="pdferror" class="errbox" hidden></div>
    </section>
    <section>
      <div id="importerrors" class="errbox" hidden></div>
      <div class="card">
        <div id="targetname" class="targetname"></div>
        <div id="dryerrors" class="errbox" hidden></div>
        <form id="docform" class="formgrid" onsubmit="return false"></form>
        <div class="actions">
          <button id="draftBtn" type="button" class="btn primary">Enregistrer le brouillon</button>
          <button id="correctBtn" type="button" class="btn primary">Correction complète et validation</button>
          <button id="validateBtn" type="button" class="btn secondary" hidden>Valider</button>
        </div>
      </div>
      <div class="card">
        <h3>Historique</h3>
        <div id="history"></div>
      </div>
    </section>
  </div>
</main>
<script src="/common.js"></script>
<script src="/detail.js"></script>
</body>
</html>
