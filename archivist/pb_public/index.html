<!doctype html>
<html lang="fr" class="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archivist — Relecture</title>
<link rel="stylesheet" href="/styles.css">

</head>
<body class="archivist-dashboard">
<header class="topbar">

      </a>
      <a class="icon-control" href="/_/" aria-label="Administration" title="Administration">

        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true"><path d="M256 8C119 8 8 119 8 256s111 248 248 248 248-111 248-248S393 8 256 8zm0 448V56a200 200 0 0 1 0 400z"/></svg>
      </button>
    </nav>
  </div>
</header>
<main class="wrap">
  <div id="tabs" class="tabs"></div>
  <details id="colchooser" class="card chooser">
    <summary>Colonnes affichées</summary>
    <div id="colgrid" class="colgrid"></div>
  </details>
  <div id="bulkbar" class="card bulkbar" hidden>
    <span id="bulkcount"></span>
    <label>Champ <select id="bulkfield"></select></label>
    <span id="bulkvalue"></span>
    <button id="bulkapply" type="button" class="btn primary">Appliquer</button>
    <button id="bulkall" type="button" class="btn secondary">Sélection filtrée entière</button>
    <button id="bulkclear" type="button" class="btn secondary">Effacer la sélection</button>
    <span id="bulkresult"></span>
  </div>
  <div class="card">
    <div class="tablewrap">
      <table id="doctable">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="pager" class="pager"></div>
  </div>
</main>
<script src="/common.js"></script>
<script src="/app.js"></script>
</body>
</html>
