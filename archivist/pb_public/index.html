<main class="wrap">
  <div id="tabs" class="tabs"></div>
  <details id="colchooser" class="card chooser">
    <summary>Colonnes affichées</summary>
    <div id="colgrid" class="colgrid"></div>
  </details>
  <div id="bulkbar" class="card bulkbar" hidden>
    <span id="bulkcount"></span>
    <label>Champ <select id="bulkfield"></select></label>
    <span id="bulkvalue"></span>
    <button id="bulkapply" type="button" class="btn iconbtn primary" title="Appliquer la valeur saisie au champ choisi pour la sélection" aria-label="Appliquer">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" aria-hidden="true"><path d="M438.6 105.4c12.5 12.5 12.5 32.8 0 45.3l-256 256c-12.5 12.5-32.8 12.5-45.3 0l-128-128c-12.5-12.5-12.5-32.8 0-45.3s32.8-12.5 45.3 0L160 338.7 393.4 105.4c12.5-12.5 32.8-12.5 45.3 0z"/></svg>
    </button>
    <button id="bulkrecalc" type="button" class="btn iconbtn secondary" title="Recalcule le champ choisi avec les règles actuelles (dry-run de classification) et ne modifie que les documents dont la valeur diffère de la valeur proposée" aria-label="Recalculer (règles)">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true"><path d="M105.1 202.6c7.7-21.8 20.2-42.3 37.8-59.8c62.5-62.5 163.8-62.5 226.3 0L386.3 160 352 160c-17.7 0-32 14.3-32 32s14.3 32 32 32l111.5 0c0 0 0 0 0 0l.4 0c17.7 0 32-14.3 32-32l0-112c0-17.7-14.3-32-32-32s-32 14.3-32 32l0 35.2L414.4 97.6c-87.5-87.5-229.3-87.5-316.8 0C73.2 122 55.6 150.7 44.8 181.4c-5.9 16.7 2.9 34.9 19.5 40.8s34.9-2.9 40.8-19.5zM39 289.3c-5 1.5-9.8 4.2-13.7 8.2c-4 4-6.7 8.8-8.1 14c-.3 1.2-.6 2.5-.8 3.8c-.3 1.7-.4 3.4-.4 5.1L16 432c0 17.7 14.3 32 32 32s32-14.3 32-32l0-35.1 17.6 17.5c0 0 0 0 0 0c87.5 87.4 229.3 87.4 316.7 0c24.4-24.4 42.1-53.1 52.9-83.8c5.9-16.7-2.9-34.9-19.5-40.8s-34.9 2.9-40.8 19.5c-7.7 21.8-20.2 42.3-37.8 59.8c-62.5 62.5-163.8 62.5-226.3 0l-.1-.1L125.6 352l34.4 0c17.7 0 32-14.3 32-32s-14.3-32-32-32L48.4 288c-1.6 0-3.2 .1-4.8 .3s-3.1 .5-4.6 1z"/></svg>
    </button>
    <button id="bulkclear" type="button" class="btn iconbtn secondary" title="Effacer la sélection" aria-label="Effacer la sélection">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 576 512" aria-hidden="true"><path d="M290.7 57.4L57.4 290.7c-25 25-25 65.5 0 90.5l80 80c12 12 28.3 18.7 45.3 18.7L288 480l9.4 0L512 480c17.7 0 32-14.3 32-32s-14.3-32-32-32l-124.1 0L518.6 285.3c25-25 25-65.5 0-90.5L381.3 57.4c-25-25-65.5-25-90.5 0zM297.4 416l-9.4 0-105.4 0-80-80L227.3 211.3 364.7 348.7 297.4 416z"/></svg>
    </button>
    <span class="bulksep" aria-hidden="true"></span>
    <button id="bulkrefile" type="button" class="btn iconbtn secondary" title="Re-filer la sélection : recalcule la clé cible de chaque document avec la configuration active (comme l'outil Re-filer tous les documents) et déplace les objets qui ne sont plus à leur place ; les documents pending sont refusés" aria-label="Re-filer la sélection">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" aria-hidden="true"><path d="M32 32l448 0c17.7 0 32 14.3 32 32l0 32c0 17.7-14.3 32-32 32L32 128C14.3 128 0 113.7 0 96L0 64C0 46.3 14.3 32 32 32zm0 128l448 0 0 256c0 35.3-28.7 64-64 64L96 480c-35.3 0-64-28.7-64-64l0-256zm128 80c0 8.8 7.2 16 16 16l160 0c8.8 0 16-7.2 16-16s-7.2-16-16-16l-160 0c-8.8 0-16 7.2-16 16z"/></svg>
    </button>
    <button id="bulkrerun" type="button" class="btn iconbtn secondary" title="Relance l'ensemble des règles sur la sélection : les champs sont remplacés par ce que produisent les règles actuelles depuis les pages stockées (comme à l'import), le fichier est re-filé et son statut repasse à « processed » ; un document dont la nouvelle classification est en erreur est ignoré sans être modifié, les documents pending sont refusés" aria-label="Relancer les règles">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" aria-hidden="true"><path d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80V432c0 17.4 9.4 33.4 24.5 41.9s33.7 8.1 48.5-.9L361 297c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41L73 39z"/></svg>
    </button>
    <span class="bulksep" aria-hidden="true"></span>
    <button id="bulkdelete" type="button" class="btn iconbtn secondary" title="Supprimer la sélection : supprime définitivement les documents de la base (historique compris) et les fichiers correspondants du bucket S3 ; à confirmer" aria-label="Supprimer la sélection">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" aria-hidden="true"><path d="M135.2 17.7L128 32H32C14.3 32 0 46.3 0 64S14.3 96 32 96H416c17.7 0 32-14.3 32-32s-14.3-32-32-32H320l-7.2-14.3C307.4 6.8 296.3 0 284.5 0H163.5c-11.8 0-22.9 6.8-28.3 17.7zM416 128H32L53.2 467c1.6 25.3 22.6 45 47.9 45H346.9c25.3 0 46.3-19.7 47.9-45L416 128z"/></svg>
    </button>
    <span id="bulkresult" role="status"></span>
  </div>
  <div class="fulltext-search">
    <label for="pageSearch">Rechercher dans le texte des pages</label>
    <input id="pageSearch" type="search" placeholder="Texte à rechercher…" autocomplete="off">
  </div>
  <div class="card">
    <div class="tablewrap">
      <table id="doctable">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="pager" class="pager"></div>
  </div>
</main>
