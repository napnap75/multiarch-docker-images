<main class="wrap config-editor">
  <div class="config-titlebar">
    <h2>Configuration active</h2>
    <div class="config-savebar">
      <span id="saveStatus" class="muted" role="status" aria-live="polite"></span>
      <button id="saveConfig" class="btn primary" type="button" disabled>Enregistrer et activer</button>
    </div>
  </div>
  <div id="loadError" class="errbox" hidden></div>
  <div class="config-columns">
    <section class="config-column config-source" aria-label="Édition de la configuration">
      <section class="config-block">
        <div class="config-block-head">
          <h3>Fields</h3>
          <button id="addField" class="btn iconbtn secondary" type="button" aria-label="Ajouter un champ" title="Ajouter un champ"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" aria-hidden="true"><path d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32V224H48c-17.7 0-32 14.3-32 32s14.3 32 32 32H192V432c0 17.7 14.3 32 32 32s32-14.3 32-32V288H400c17.7 0 32-14.3 32-32s-14.3-32-32-32H256V80z"/></svg></button>
        </div>
        <div class="tablewrap config-tablewrap">
          <table class="config-table">
            <thead><tr><th>Nom</th><th>Titre français</th><th>Type</th><th>Obligatoire</th><th></th></tr></thead>
            <tbody id="fieldsBody"></tbody>
          </table>
        </div>
      </section>
      <section class="config-block">
        <div class="config-block-head">
          <h3>Rules</h3>
          <button id="addRuleGroup" class="btn iconbtn secondary" type="button" aria-label="Ajouter une section" title="Ajouter une section"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" aria-hidden="true"><path d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32V224H48c-17.7 0-32 14.3-32 32s14.3 32 32 32H192V432c0 17.7 14.3 32 32 32s32-14.3 32-32V288H400c17.7 0 32-14.3 32-32s-14.3-32-32-32H256V80z"/></svg></button>
        </div>
        <div id="ruleGroups" class="rule-groups"></div>
      </section>
      <section class="config-block">
        <div class="config-block-head">
          <h3>Templates</h3>
          <button id="addTemplate" class="btn iconbtn secondary" type="button" aria-label="Ajouter un modèle" title="Ajouter un modèle"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" aria-hidden="true"><path d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32V224H48c-17.7 0-32 14.3-32 32s14.3 32 32 32H192V432c0 17.7 14.3 32 32 32s32-14.3 32-32V288H400c17.7 0 32-14.3 32-32s-14.3-32-32-32H256V80z"/></svg></button>
        </div>
        <div class="tablewrap config-tablewrap">
          <table class="config-table templates-table">
            <thead><tr><th>Nom</th><th>Chemin et expressions</th><th></th></tr></thead>
            <tbody id="templatesBody"></tbody>
          </table>
        </div>
      </section>
    </section>
    <section class="config-column config-test" aria-label="Test de classification">
      <section class="config-block config-test-block">
        <div class="config-block-head">
          <h3>Contenu du document</h3>
          <nav id="documentNav" class="docnav" aria-label="Navigation entre documents" hidden>
            <a id="prevDoc" class="docnav-link" aria-label="Document précédent" title="Document précédent">
              <span aria-hidden="true">&larr;</span>
            </a>
            <a id="nextDoc" class="docnav-link" aria-label="Document suivant" title="Document suivant">
              <span aria-hidden="true">&rarr;</span>
            </a>
          </nav>
        </div>
        <textarea id="pagesInput" class="pages-input" aria-label="Pages du document (JSON)" spellcheck="false" placeholder='["Texte de la page 1", "Texte de la page 2"]'></textarea>
      </section>
      <section class="config-block config-test-block">
        <div class="config-block-head"><h3>Erreurs</h3></div>
        <div id="testErrors" class="errbox" role="alert" hidden></div>
        <div id="noErrors" class="muted">Aucune erreur.</div>
      </section>
      <section class="config-block config-test-block">
        <div class="config-block-head"><h3>Fichier</h3></div>
        <div id="documentName" class="muted config-document-name"></div>
        <div id="documentKey" class="muted config-document-name"></div>
        <div id="targetName" class="targetname"></div>
      </section>
      <section class="config-block config-test-block">
        <div class="config-block-head"><h3>Champs</h3></div>
        <table class="config-table output-table">
          <thead><tr><th>Champ</th><th>Valeur actuelle</th><th>Proposition</th></tr></thead>
          <tbody id="outputFields"></tbody>
        </table>
      </section>
      <section class="config-block config-test-block config-trace">
        <div class="config-block-head"><h3>Traces</h3></div>
        <div id="traceList" class="trace-list"></div>
      </section>
    </section>
  </div>
</main>
<dialog id="whenDialog" class="when-dialog" aria-label="Documents concernés par la condition">
  <div class="when-dialog-head">
    <h3>Documents concernés par la condition</h3>
    <button id="whenClose" class="btn secondary" type="button">Fermer</button>
  </div>
  <div id="whenErrors" class="errbox" role="alert" hidden></div>
  <div id="whenRules" class="when-rules" aria-label="Conditions de la section"></div>
  <div id="whenResultsHead" class="when-results-head muted"></div>
  <div id="whenResults" class="when-results" aria-live="polite"></div>
</dialog>
<script src="/common.js"></script>
<script src="/config-editor.js"></script>
</body>
</html>
