# Template and Company-Type Mapping Configuration
# This file defines the complete document processing configuration
# 
# Structure:
# 1. companies: Predefined list of valid companies (for validation)
# 2. document_types: Predefined list of valid document types (for validation)
# 3. mappings: (company, document_type) -> template mapping with period rules
# 4. templates: Template definitions with key patterns
#
# Workflow:
# 1. Extract first page text
# 2. Find emission date using regex patterns from date_extraction
# 3. Find company and document_type using ML, but validate against companies/document_types lists
# 4. Look up (company, document_type) in mappings to get template and period rule
# 5. If no mapping found -> route to review
# 6. Apply period rule to calculate period from emission date
# 7. Apply template key_pattern to generate filename

version: "1.0"

# Predefined companies - only these values are valid
# If ML extracts a company not in this list, document is routed to review
companies:
  - "EDF"
  - "Engie"
  - "BNP Paribas"
  - "Societe Generale"
  - "Credit Agricole"
  - "La Banque Postale"
  - "Orange"
  - "SFR"
  - "Free"
  - "Bouygues Telecom"
  - "TotalEnergies"
  - "ENEDIS"
  - "GRDF"
  - "Veolia"
  - "Suez"

# Predefined document types - only these values are valid
# If ML extracts a document_type not in this list, document is routed to review
document_types:
  - "facture"
  - "releve"
  - "contrat"
  - "avis"

# Date extraction regex patterns
# Applied in order to the extracted text to find the emission date
# First match wins
date_extraction:
  # Try to find dates in DD/MM/YYYY or DD-MM-YYYY format
  - pattern: "([0-9]{1,2})[/-]([0-9]{1,2})[/-]([0-9]{4})"
    description: "DD/MM/YYYY or DD-MM-YYYY"
  # Try to find dates in YYYY-MM-DD format (ISO)
  - pattern: "([0-9]{4})[-/]([0-9]{1,2})[-/]([0-9]{1,2})"
    description: "YYYY-MM-DD (ISO format)"
  # Try French date formats
  - pattern: "([0-9]{1,2}) (janvier|fevrier|mars|avril|mai|juin|juillet|aout|septembre|octobre|novembre|decembre) ([0-9]{4})"
    description: "DD MonthName YYYY (French)"
  # Try MonthName YYYY
  - pattern: "(janvier|fevrier|mars|avril|mai|juin|juillet|aout|septembre|octobre|novembre|decembre) ([0-9]{4})"
    description: "MonthName YYYY"
  # Try YYYY only
  - pattern: "([0-9]{4})"
    description: "Year only (YYYY)"

# Mapping: (company, document_type) -> template + period rule
mappings:
  - company: "EDF"
    document_type: "facture"
    template: "edf_invoice"
    period:
      granularity: month
      offset: current

  - company: "Engie"
    document_type: "facture"
    template: "engie_invoice"
    period:
      granularity: month
      offset: current

  - company: "BNP Paribas"
    document_type: "releve"
    template: "bank_statement"
    period:
      granularity: month
      offset: current

  - company: "Societe Generale"
    document_type: "releve"
    template: "bank_statement"
    period:
      granularity: month
      offset: current

  - company: "Credit Agricole"
    document_type: "releve"
    template: "bank_statement"
    period:
      granularity: month
      offset: current

  - company: "Orange"
    document_type: "facture"
    template: "telecom_invoice"
    period:
      granularity: month
      offset: current

  - company: "SFR"
    document_type: "facture"
    template: "telecom_invoice"
    period:
      granularity: month
      offset: current

  - company: "Free"
    document_type: "facture"
    template: "telecom_invoice"
    period:
      granularity: month
      offset: current

  - company: "TotalEnergies"
    document_type: "facture"
    template: "energy_invoice"
    period:
      granularity: month
      offset: current

  - company: "ENEDIS"
    document_type: "facture"
    template: "enedis_invoice"
    period:
      granularity: month
      offset: current

  - company: "GRDF"
    document_type: "facture"
    template: "grdf_invoice"
    period:
      granularity: month
      offset: current

  - company: "Veolia"
    document_type: "facture"
    template: "water_invoice"
    period:
      granularity: month
      offset: current

  - company: "Suez"
    document_type: "facture"
    template: "water_invoice"
    period:
      granularity: month
      offset: current

  - company: "EDF"
    document_type: "avis"
    template: "edf_notice"
    period:
      granularity: quarter
      offset: current

# Templates define the key pattern for the final filename
templates:
  edf_invoice:
    key_pattern: "{emitting_company}/{period}/{document_type}/{emission_date}_{original_filename}"

  engie_invoice:
    key_pattern: "{emitting_company}/{period}/{document_type}/{emission_date}_{original_filename}"

  bank_statement:
    key_pattern: "Banques/{emitting_company}/{period}/{document_type}/{emission_date}_{original_filename}"

  telecom_invoice:
    key_pattern: "Telecoms/{emitting_company}/{period}/{document_type}/{emission_date}_{original_filename}"

  energy_invoice:
    key_pattern: "Energie/{emitting_company}/{period}/{document_type}/{emission_date}_{original_filename}"

  water_invoice:
    key_pattern: "Eau/{emitting_company}/{period}/{document_type}/{emission_date}_{original_filename}"

  enedis_invoice:
    key_pattern: "Energie/ENEDIS/{period}/{document_type}/{emission_date}_{original_filename}"

  grdf_invoice:
    key_pattern: "Energie/GRDF/{period}/{document_type}/{emission_date}_{original_filename}"

  edf_notice:
    key_pattern: "{emitting_company}/{period}/{document_type}/{emission_date}_{original_filename}"
