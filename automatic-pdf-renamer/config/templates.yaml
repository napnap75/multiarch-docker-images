# Template and Company-Type Mapping Configuration
# This file defines the complete document processing configuration
# 
# Structure:
# 1. companies: Predefined list of valid companies (for validation)
# 2. document_types: Predefined list of valid document types (for validation)
# 3. field_groups: Predefined lists of additional fields per field type
# 4. mappings: (company, document_type) -> template mapping with period rules and field groups
# 5. templates: Template definitions with key patterns
#
# Workflow:
# 1. Extract first page text
# 2. Find emission date using regex patterns from date_extraction
# 3. Find company and document_type using ML, but validate against companies/document_types lists
# 4. Look up (company, document_type) in mappings to get template, period rule, and field groups
# 5. For each field group in the mapping, find the field value using ML from the predefined list
# 6. If no mapping found -> route to review
# 7. If field values cannot be determined -> route to review
# 8. Apply period rule to calculate period from emission date
# 9. Apply template key_pattern to generate filename

version: "1.0"

# Predefined companies - only these values are valid
# If ML extracts a company not in this list, document is routed to review
companies:
  - "EDF"
  - "Engie"
  - "BNP Paribas"
  - "Societe Generale"
  - "Credit Agricole"
  - "La Banque Postale"
  - "Orange"
  - "SFR"
  - "Free"
  - "Bouygues Telecom"
  - "TotalEnergies"
  - "ENEDIS"
  - "GRDF"
  - "Veolia"
  - "Suez"

# Predefined document types - only these values are valid
# If ML extracts a document_type not in this list, document is routed to review
document_types:
  - "facture"
  - "releve"
  - "contrat"
  - "avis"

# Predefined field groups with their possible values
# Each field group contains a list of possible values for that field type
# The ML will extract the value from the predefined list for the field group
field_groups:
  # Bank account numbers for bank statements
  bank_accounts:
    - "FR76 1234 5678 9012 3456 7890 123"
    - "FR76 2345 6789 0123 4567 8901 234"
    - "FR76 3456 7890 1234 5678 9012 345"
    - "FR76 4567 8901 2345 6789 0123 456"

  # Property addresses for building-related documents
  properties:
    - "123 Rue de Paris, 75001 Paris"
    - "456 Avenue des Champs, 75002 Paris"
    - "789 Boulevard de la Republique, 69001 Lyon"
    - "321 Rue de la Gare, 13001 Marseille"

  # Contract references
  contract_references:
    - "CONT-2024-001"
    - "CONT-2024-002"
    - "CONT-2024-003"
    - "REF-2024-ABC"

  # Customer numbers
  customer_numbers:
    - "CUST-12345678"
    - "CUST-87654321"
    - "CLIENT-001"
    - "CLIENT-002"

# Date extraction regex patterns
# Applied in order to the extracted text to find the emission date
# First match wins
date_extraction:
  # Try to find dates in DD/MM/YYYY or DD-MM-YYYY format
  - pattern: "([0-9]{1,2})[/-]([0-9]{1,2})[/-]([0-9]{4})"
    description: "DD/MM/YYYY or DD-MM-YYYY"
  # Try to find dates in YYYY-MM-DD format (ISO)
  - pattern: "([0-9]{4})[-/]([0-9]{1,2})[-/]([0-9]{1,2})"
    description: "YYYY-MM-DD (ISO format)"
  # Try French date formats
  - pattern: "([0-9]{1,2}) (janvier|fevrier|mars|avril|mai|juin|juillet|aout|septembre|octobre|novembre|decembre) ([0-9]{4})"
    description: "DD MonthName YYYY (French)"
  # Try MonthName YYYY
  - pattern: "(janvier|fevrier|mars|avril|mai|juin|juillet|aout|septembre|octobre|novembre|decembre) ([0-9]{4})"
    description: "MonthName YYYY"
  # Try YYYY only
  - pattern: "([0-9]{4})"
    description: "Year only (YYYY)"

# Mapping: (company, document_type) -> template + period rule + field groups
# Each entry defines:
#   - company: The emitting company (must be in companies list)
#   - document_type: The document type (must be in document_types list)
#   - template: The template to use for this combination
#   - period: The period rule (granularity and offset)
#   - field_groups: List of field group names to extract values from
#
# If a document's (company, document_type) tuple is not in this list,
# it will be routed to review (not processed status)
#
# For each field group in the mapping, the ML will extract the value
# from the predefined list in field_groups.
mappings:
  # EDF - Electricity bills
  - company: "EDF"
    document_type: "facture"
    template: "edf_invoice"
    period:
      granularity: month
      offset: current
    field_groups:
      - contract_references
      - customer_numbers

  - company: "EDF"
    document_type: "avis"
    template: "edf_notice"
    period:
      granularity: quarter
      offset: current
    field_groups:
      - contract_references

